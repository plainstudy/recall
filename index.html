<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0E1620">
    <title>Phase 0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e1620;
        color: #d8e0e8;
        font: 18px/1.5 system-ui, sans-serif;
      }
      main {
        padding: 24px 16px;
        max-width: 480px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px 16px;
        margin: 0;
      }
      dt {
        color: #8494a4;
      }
      dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <dl>
        <dt>Engine version</dt>
        <dd id="version">-</dd>
        <dt>Installed</dt>
        <dd id="installed">-</dd>
        <dt>Service worker active</dt>
        <dd id="worker">-</dd>
        <dt>Network</dt>
        <dd id="network">-</dd>
      </dl>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
